name: Build The Cube Beta 6.4.0

on:
  push:
    branches: [main]
    tags: [6.4.0]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: cube-beta-6.4.0-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Halloween Windows downloads
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - name: Check out source
        uses: actions/checkout@v6

      - name: Download verified fallback music
        shell: pwsh
        run: .\tools\Get-FallMusic.ps1

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
          cache: pip

      - name: Set up Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.25.x"
          cache: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "8.0.x"

      - name: Install Python dependencies
        shell: pwsh
        run: python -m pip install --disable-pip-version-check -r requirements.txt

      - name: Test Halloween, OG.exe, game, themes, and CPE
        shell: pwsh
        env:
          SDL_VIDEODRIVER: dummy
          SDL_AUDIODRIVER: dummy
        run: python -m unittest test_cpeloader test_halloween_music test_og_recovery test_nuttymod_isolation test_error_update test_summer_game test_theme_system test_legacy_versions cpe.tests.test_cpe cpe.tests.test_full_stack -v

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --no-progress --yes

      - name: Build installer and portable download
        shell: pwsh
        run: .\tools\Prepare-Release.ps1 -Version 6.4.0

      - name: Upload nightly.link artifact
        uses: actions/upload-artifact@v7
        with:
          name: The-Cube-Beta-6.4.0-Windows
          path: release-download/*
          if-no-files-found: error
          retention-days: 90
          compression-level: 0

      - name: Publish GitHub Release
        if: github.ref == 'refs/tags/6.4.0'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view 6.4.0 --repo $env:GITHUB_REPOSITORY *> $null
          if ($LASTEXITCODE -eq 0) {
            gh release upload 6.4.0 release-download/* --clobber --repo $env:GITHUB_REPOSITORY
            gh release edit 6.4.0 --title "The Cube Beta Halloween Update 6.4.0" --notes-file RELEASE_NOTES_6.4.0.md --latest --repo $env:GITHUB_REPOSITORY
          } else {
            gh release create 6.4.0 release-download/* --verify-tag --title "The Cube Beta Halloween Update 6.4.0" --notes-file RELEASE_NOTES_6.4.0.md --latest --repo $env:GITHUB_REPOSITORY
          }
