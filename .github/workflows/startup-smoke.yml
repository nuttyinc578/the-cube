name: Actions startup diagnostic

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  startup:
    runs-on: windows-latest
    steps:
      - name: Create diagnostic artifact
        shell: pwsh
        run: Set-Content -LiteralPath 'startup-diagnostic.txt' -Value 'Official actions can run.'

      - name: Upload diagnostic artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: startup-diagnostic
          path: startup-diagnostic.txt
          if-no-files-found: error
